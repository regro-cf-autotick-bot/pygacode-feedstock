{% set name = "pygacode" %}
{% set version = "0.71" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ea5bac0caae0cf1d7bfdaa775d4f73912cb5f5f56157467e5fe72b4c75b1ee92
  patches:
    - 0001-changing.patch  # [linux]

build:
  number: 3
  script: {{ PYTHON }} -m pip install . -vv
  skip: true  # [py<=36 or win or linux32 or python_impl == 'pypy']

requirements:
  build:
    - {{ compiler('fortran') }}
    - {{ stdlib("c") }}
    - libgomp      # [linux]
    - llvm-openmp  # [osx]
  host:
    - pip
    - python
    - numpy >=1.18
    - libgomp      # [linux]
    - llvm-openmp  # [osx]

  run:
    - python
    - {{ pin_compatible('numpy') }}
    - libgomp      # [linux]
    - llvm-openmp  # [osx]
    - scikit-image >=0.13

about:
  home: https://gacode.io/
  license: MIT
  license_family: MIT
  license_file: PKG-INFO
  summary: Python interface to gacode profile and geometry tools.
  doc_url: https://gacode.io/

extra:
  recipe-maintainers:
    - kalling
    - smithsp
    - orso82
